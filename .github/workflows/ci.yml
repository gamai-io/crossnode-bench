name: ci
on:
  push:
  pull_request:
jobs:
  demo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run demo benchmark
        run: python crossnode.py --demo > demo.json
      - name: Validate demo invariants
        run: |
          python - <<'PY'
          import json
          d = json.load(open("demo.json"))
          assert d["records"] == 48, d
          assert d["passed"] == 46, d
          assert d["false_success"] == 2, d
          assert abs(d["pass_rate"] - 0.9583) < 1e-4, d
          print("demo invariants ok")
          PY
