name: ci
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Score the scorer
        run: python -m pytest tests -q
  demo:
    runs-on: ubuntu-latest
    needs: tests
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run demo benchmark
        run: python crossnode.py --demo > demo.json
      - name: Validate demo invariants
        run: |
          python - <<'PY'
          import json
          d = json.load(open("demo.json"))
          assert d["records"] == 48, d
          assert d["passed"] == 46, d
          assert d["false_success"] == 2, d
          assert abs(d["pass_rate"] - 0.9583) < 1e-4, d
          print("demo invariants ok")
          PY
